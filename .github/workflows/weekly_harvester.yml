name: Weekly Academic Harvester

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  harvest-and-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harvester
        run: python crawler.py

      - name: Upload Downloaded Papers
        uses: actions/upload-artifact@v4
        with:
          name: weekly-papers-${{ github.run_number }}
          path: |
            downloaded_pdfs/
            download_report.xlsx
          retention-days: 14
